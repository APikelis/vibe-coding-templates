# Pre-commit configuration.
# Install:  uv run pre-commit install --install-hooks && uv run pre-commit install --hook-type pre-push
# Run all:  uv run pre-commit run --all-files
#
# Every `rev` is a full commit SHA with the tag beside it, so a moved or compromised tag cannot
# change what runs. Update with:  uv run pre-commit autoupdate --freeze
#
# Ruff replaces black, isort, flake8 and bandit. mypy and pytest run through uv so they use the
# project's own locked versions rather than a second copy pre-commit would install.

minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Secrets: scans staged changes here; CI scans full history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false

      # Slower checks wait for push, so commits stay fast.
      - id: pytest
        name: pytest (with coverage floor from pyproject.toml)
        entry: uv run pytest --cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
